name: build-on-push

on:
  push:
    branches-ignore:
      - main
  # Pushes made with GITHUB_TOKEN start no run, so the release and the Dependabot merge
  # dispatch this workflow on dev to build and publish what they pushed.
  workflow_dispatch:

concurrency:
  group: build-on-push-${{ github.ref }}
  # A newer push cancels an in-progress branch build; dev builds are never cancelled mid-run,
  # and a newer dev push replaces only an older pending run (which already covers its predecessor's snapshot).
  cancel-in-progress: ${{ github.ref_name != 'dev' }}

jobs:
  # Snapshots publish from dev only; releases publish through the release workflow. Central's
  # publishing limits harden on 2026-10-01 and Sonatype does not say whether snapshots count
  # toward them, so feature branches build without publishing. osslabz-publish carries
  # central-publishing-maven-plugin, which routes a -SNAPSHOT to Central's snapshot repository
  # by itself; the signature stays in osslabz-release, because Central validates a release and
  # takes a snapshot as it comes.
  build-on-push:
    permissions:
      contents: read
    uses: osslabz/github-actions/.github/workflows/build.yml@v1
    with:
      publish-target: central
      publish-branches: dev
      maven-profiles: osslabz-publish
    secrets:
      central-username: ${{ secrets.OSSRH_USERNAME }}
      central-token: ${{ secrets.OSSRH_TOKEN }}
