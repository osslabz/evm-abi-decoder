name: release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      # workflow_dispatch has no branch filter; a failing step rather than a job-level `if`,
      # which would report a mis-dispatch as a green skip.
      - name: guard-release-ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "::error::releases run on dev only; this run was dispatched from $GITHUB_REF"
            exit 1
          fi

      # No `ref`: maven-scm pushes the release commits to the branch checked out, which is dev.
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: setup-jdk
        uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.OSSRH_GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: maven-build-verify
        run: mvn --batch-mode verify

      - name: configure-git-user
        uses: qoomon/actions--setup-git@v1
        with:
          user: bot

      - name: release-publish-on-maven-central
        run: mvn --batch-mode -P osslabz-release clean release:prepare release:perform
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.OSSRH_GPG_SECRET_KEY_PASSWORD }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}

      - name: 'get-latest-tag'
        id: 'get-latest-tag'
        uses: "WyriHaximus/github-action-get-previous-tag@v2"

      # main only follows the published tag, and without --force git accepts nothing but a
      # fast-forward. The tag is annotated and a branch cannot point at a tag object.
      - name: fast-forward-main
        env:
          TAG: ${{ steps.get-latest-tag.outputs.tag }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          git push origin "${tag_commit}:refs/heads/main"

      - name: create-release-notes
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: ${{ steps.get-latest-tag.outputs.tag }}
