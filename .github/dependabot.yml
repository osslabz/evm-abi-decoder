version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Pinned by SHA, every release of every action is an update; one pull request a week
    # carries them through one build and one merge.
    groups:
      github-actions:
        patterns:
          - "*"
